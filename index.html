<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="color-scheme" content="light dark">
<title>Registro de Excavación V2</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#16625E">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Registro Arq V2">
<link rel="icon" type="image/svg+xml" href="icons/icon.svg">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600&family=Barlow:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<script src="plates.js"></script>
<script src="qrcode.min.js"></script>
<script src="jszip.min.js"></script>
<style>
html{color-scheme:light}
[hidden]{display:none!important}
/* Diseño: panel de campo. Barra lateral + hoja de trabajo; el color codifica el tipo de ficha
   (estrato = ocre, estructura = ladrillo, esqueleto = ciruela, cata muraria = pizarra) y el acento verdoso marca la acción. */
:root{
  --bg:#ECEFED; --surface:#FFFFFF; --surface-2:#F4F6F5; --surface-3:#E8ECEA;
  --ink:#162024; --ink-2:#47565B; --ink-3:#74848A; --line:#D5DCD9; --line-2:#BFC9C6;
  --accent:#16625E; --accent-ink:#FFFFFF; --accent-soft:#DCEDEA;
  --c-estrato:#9A680F; --c-estructura:#A03C29; --c-esqueleto:#6B4A8A; --c-muraria:#33578B;
  --ok:#2A7A49; --warn:#9F680C; --err:#B0342A; --info:#33578B;
  --shadow:0 1px 2px rgba(18,32,36,.06),0 6px 18px rgba(18,32,36,.06);
  --f-display:'Barlow Condensed','Arial Narrow',Arial,sans-serif;
  --f-body:'Barlow',system-ui,-apple-system,'Segoe UI',Roboto,Arial,sans-serif;
  --f-mono:'IBM Plex Mono',ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  --r:6px;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0F1618; --surface:#162023; --surface-2:#1B282B; --surface-3:#223236;
    --ink:#E3EBE9; --ink-2:#A3B4B5; --ink-3:#7B8E91; --line:#2B3C40; --line-2:#3A4E53;
    --accent:#52B5AE; --accent-ink:#0B1A1B; --accent-soft:#1B3636;
    --c-estrato:#DDAA4A; --c-estructura:#E78068; --c-esqueleto:#B79AD8; --c-muraria:#86AADB;
    --ok:#5CBB82; --warn:#E0A53E; --err:#EE7B6F; --info:#86AADB;
    --shadow:0 1px 2px rgba(0,0,0,.4),0 6px 18px rgba(0,0,0,.35);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0F1618; --surface:#162023; --surface-2:#1B282B; --surface-3:#223236;
  --ink:#E3EBE9; --ink-2:#A3B4B5; --ink-3:#7B8E91; --line:#2B3C40; --line-2:#3A4E53;
  --accent:#52B5AE; --accent-ink:#0B1A1B; --accent-soft:#1B3636;
  --c-estrato:#DDAA4A; --c-estructura:#E78068; --c-esqueleto:#B79AD8; --c-muraria:#86AADB;
  --ok:#5CBB82; --warn:#E0A53E; --err:#EE7B6F; --info:#86AADB;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 6px 18px rgba(0,0,0,.35);
  color-scheme:dark;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{background:var(--bg);color:var(--ink);font:15px/1.45 var(--f-body);margin:0;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:16px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:60;background:var(--bg)}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3,h4{margin:0;font-weight:600;text-wrap:balance}
a{color:var(--accent)}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.muted{color:var(--ink-2)} .faint{color:var(--ink-3)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:3px}
svg.i{flex:none;display:block}

/* ---------- shell ---------- */
#app{display:grid;grid-template-columns:236px minmax(0,1fr);gap:20px;max-width:1500px;margin:0 auto;align-items:start}
#side{position:sticky;top:calc(16px + env(safe-area-inset-top,0px));max-height:calc(100vh - 32px);display:flex;flex-direction:column;gap:14px;
  background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px;overflow:auto}
.brand{display:flex;gap:10px;align-items:center}
.brand .mark{width:34px;height:34px;flex:none}
.brand b{display:block;font:600 19px/1 var(--f-display);letter-spacing:.03em;text-transform:uppercase}
.brand small{display:block;color:var(--ink-3);font-size:11.5px;margin-top:2px}
.pj{display:flex;flex-direction:column;gap:6px}
.pj select{width:100%}
.nav{display:flex;flex-direction:column;gap:2px}
.nav button{display:flex;align-items:center;gap:10px;padding:9px 10px;border:0;border-radius:5px;background:none;cursor:pointer;text-align:left;color:var(--ink-2);font-weight:500}
.nav button:hover{background:var(--surface-2);color:var(--ink)}
.nav button[aria-current="page"]{background:var(--accent-soft);color:var(--accent);font-weight:600}
.nav .n{margin-left:auto;font:500 12px var(--f-mono);color:var(--ink-3)}
.nav .n.bad{color:var(--err);font-weight:600}
.side-foot{margin-top:auto;display:flex;flex-direction:column;gap:10px;padding-top:10px;border-top:1px solid var(--line)}
.savestate{font-size:12.5px;color:var(--ink-3);display:flex;gap:6px;align-items:center}
.dot{width:8px;height:8px;border-radius:50%;background:var(--ok);flex:none}
.dot.pending{background:var(--warn)} .dot.error{background:var(--err)}

:root[data-theme="solar"]{
  --bg:#FFFFFF; --surface:#FFFFFF; --surface-2:#F2F2F2; --surface-3:#E5E5E5;
  --ink:#000000; --ink-2:#111111; --ink-3:#333333; --line:#000000; --line-2:#000000;
  --accent:#004D40; --accent-ink:#FFFFFF; --accent-soft:#E0F2F1;
  --c-estrato:#804000; --c-estructura:#8A1C00; --c-esqueleto:#4B0082; --c-muraria:#003366;
  --ok:#006400; --warn:#B8860B; --err:#8B0000; --info:#003366;
  --shadow:none;
  color-scheme:light;
}
.speech-btn{display:inline-flex;align-items:center;justify-content:center;padding:3px 7px;border-radius:4px;border:1px solid var(--line);background:var(--surface);cursor:pointer;color:var(--ink-2);margin-left:auto}
.speech-btn.rec{background:#FFEBEE;border-color:#D32F2F;color:#D32F2F;animation:pulseRec 1.2s infinite}
@keyframes pulseRec{0%{opacity:1}50%{opacity:0.4}100%{opacity:1}}
.geo-badge{display:inline-flex;align-items:center;gap:6px;padding:3px 8px;border-radius:4px;background:var(--accent-soft);color:var(--accent);font-family:var(--f-mono);font-size:11.5px;font-weight:600}

.netstate{font-size:12px;color:var(--ink-3);display:flex;gap:6px;align-items:center}
.dot.online{background:var(--ok)} .dot.offline{background:var(--warn)}
#btn-pwa-install{display:none;width:100%;margin-top:6px;gap:6px;align-items:center;justify-content:center}
.pwa-badge{display:inline-flex;align-items:center;gap:4px;padding:2px 7px;border-radius:4px;font-size:11px;font-weight:600;background:var(--accent-soft);color:var(--accent)}

#main{min-width:0;display:flex;flex-direction:column;gap:16px}
#top{position:sticky;top:env(safe-area-inset-top,0px);z-index:30;background:var(--bg);padding-block:2px 10px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
#top h1{font:600 28px/1.05 var(--f-display);letter-spacing:.02em;text-transform:uppercase;margin-right:auto}
#top .sub{display:block;font:400 13px var(--f-body);letter-spacing:0;text-transform:none;color:var(--ink-3);margin-top:3px}
.search{position:relative;flex:0 1 280px;min-width:170px}
.search input[type=search]{padding-left:34px;width:100%}
.search .i{position:absolute;left:10px;top:50%;transform:translateY(-50%);color:var(--ink-3);pointer-events:none}
#tabbar{display:none}

/* ---------- controls ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;min-height:38px;padding:7px 13px;border-radius:var(--r);border:1px solid var(--line-2);
  background:var(--surface);cursor:pointer;font-weight:500;white-space:nowrap;line-height:1.1}
.btn:hover{background:var(--surface-2);border-color:var(--ink-3)}
.btn:active{transform:translateY(1px)}
.btn.p{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:600}
.btn.p:hover{filter:brightness(1.08)}
.btn.d{color:var(--err);border-color:color-mix(in srgb,var(--err) 45%,var(--line))}
.btn.d:hover{background:color-mix(in srgb,var(--err) 10%,var(--surface))}
.btn.g{border-color:transparent;background:none}
.btn.g:hover{background:var(--surface-2)}
.btn.s{min-height:30px;padding:3px 9px;font-size:13.5px}
.btn.ic{padding:7px;min-width:38px}
.btn.s.ic{min-width:30px;padding:3px}
.btn[disabled]{opacity:.45;pointer-events:none}
input[type=text],input[type=number],input[type=date],input[type=search],input:not([type]),select,textarea{
  width:100%;min-height:38px;padding:7px 10px;border:1px solid var(--line-2);border-radius:var(--r);background:var(--surface);color:var(--ink)}
textarea{resize:vertical;min-height:84px;line-height:1.45}
input:focus,select:focus,textarea:focus{outline:2px solid color-mix(in srgb,var(--accent) 70%,transparent);outline-offset:0;border-color:var(--accent)}
input::placeholder,textarea::placeholder{color:var(--ink-3)}
input[type=checkbox]{width:18px;height:18px;accent-color:var(--accent);flex:none;margin:0}
input[type=number]{font-family:var(--f-mono)}
.fld{display:flex;flex-direction:column;gap:4px;min-width:0}
.fld .lb,.lb{font:600 12.5px/1.1 var(--f-display);letter-spacing:.08em;text-transform:uppercase;color:var(--ink-2)}
.fld .hint{font-size:12px;color:var(--ink-3)}
.chk{display:inline-flex;align-items:center;gap:8px;cursor:pointer;min-height:32px;padding:3px 10px 3px 8px;border:1px solid var(--line);border-radius:var(--r);background:var(--surface)}
.chk:hover{border-color:var(--line-2)}
.chk:has(input:checked){background:var(--accent-soft);border-color:color-mix(in srgb,var(--accent) 50%,var(--line))}
.seg{display:inline-flex;border:1px solid var(--line-2);border-radius:var(--r);overflow:hidden;background:var(--surface);flex-wrap:nowrap}
.seg button{border:0;background:none;padding:6px 11px;min-height:36px;cursor:pointer;border-right:1px solid var(--line);color:var(--ink-2);font-weight:500;white-space:nowrap}
.seg button:last-child{border-right:0}
.seg button:hover{background:var(--surface-2)}
.seg button.on{background:var(--accent);color:var(--accent-ink);font-weight:600}
.seg.sm button{min-height:28px;padding:2px 9px;font-size:13.5px}
.seg.wrap{flex-wrap:wrap}

.tag{display:inline-flex;align-items:center;gap:5px;padding:2px 8px;border-radius:99px;font:600 11.5px/1.5 var(--f-display);letter-spacing:.07em;text-transform:uppercase;
  color:var(--tc,var(--ink-2));background:color-mix(in srgb,var(--tc,var(--ink-2)) 13%,var(--surface));border:1px solid color-mix(in srgb,var(--tc,var(--ink-2)) 35%,var(--surface))}
.t-estrato{--tc:var(--c-estrato)} .t-corte{--tc:#C0392B}
.corte-badge{font-family:var(--f-mono);font-size:11px;font-weight:700;padding:1px 5px;border-radius:3px;border:1px dashed var(--tc);margin-left:4px}
 .t-estructura{--tc:var(--c-estructura)} .t-muraria{--tc:var(--c-muraria)} .t-esqueleto{--tc:var(--c-esqueleto)}
.st{--tc:var(--ink-3)} .st-completa{--tc:var(--accent)} .st-revisada{--tc:var(--ok)}
.sev-err{--tc:var(--err)} .sev-warn{--tc:var(--warn)} .sev-info{--tc:var(--info)}
.meter{display:block;height:6px;border-radius:9px;background:var(--surface-3);overflow:hidden;min-width:48px}
.meter>i{display:block;height:100%;background:var(--accent);border-radius:9px}
.meter.lo>i{background:var(--err)} .meter.mid>i{background:var(--warn)} .meter.hi>i{background:var(--ok)}

/* ---------- generic blocks ---------- */
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r)}
.panel>header{display:flex;align-items:center;gap:10px;padding:12px 16px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.panel>header h2,.panel>header h3{font:600 17px/1 var(--f-display);letter-spacing:.06em;text-transform:uppercase}
.panel>header .sp{margin-left:auto;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.panel>.bd{padding:16px}
.g{display:grid;gap:14px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))} .g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))} .g6{grid-template-columns:repeat(6,minmax(0,1fr))}
.span2{grid-column:span 2} .span3{grid-column:span 3} .span4{grid-column:1/-1}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.banner{display:flex;gap:12px;align-items:center;flex-wrap:wrap;padding:11px 14px;border:1px solid color-mix(in srgb,var(--warn) 40%,var(--line));border-radius:var(--r);background:color-mix(in srgb,var(--warn) 9%,var(--surface))}
.banner.info{border-color:color-mix(in srgb,var(--info) 40%,var(--line));background:color-mix(in srgb,var(--info) 8%,var(--surface))}
.banner .sp{margin-left:auto;display:flex;gap:8px}
.empty{padding:36px 16px;text-align:center;color:var(--ink-2)}
.empty b{display:block;font:600 20px var(--f-display);letter-spacing:.05em;text-transform:uppercase;color:var(--ink);margin-bottom:4px}

/* ---------- panel de control ---------- */
.stats{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));border:1px solid var(--line);border-radius:var(--r);background:var(--surface)}
.stat{padding:14px 16px;border-right:1px solid var(--line);display:flex;flex-direction:column;gap:4px;min-width:0}
.stat:last-child{border-right:0}
.stat .k{font:600 12.5px var(--f-display);letter-spacing:.09em;text-transform:uppercase;color:var(--ink-3)}
.stat .v{font:600 34px/1 var(--f-display);font-variant-numeric:tabular-nums}
.stat .s{font-size:12.5px;color:var(--ink-3)}
.split{display:grid;grid-template-columns:minmax(0,3fr) minmax(0,2fr);gap:16px}
.bar{display:flex;height:14px;border-radius:3px;overflow:hidden;background:var(--surface-3)}
.bar i{display:block;height:100%}
.bars{display:flex;flex-direction:column;gap:14px}
.bars .l{display:flex;justify-content:space-between;font-size:13.5px;margin-bottom:5px}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12.5px;color:var(--ink-2)}
.legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:5px;vertical-align:-1px}
.list{display:flex;flex-direction:column}
.list .it{display:flex;gap:10px;align-items:center;padding:9px 16px;border-top:1px solid var(--line);cursor:pointer;text-align:left;background:none;border-left:0;border-right:0;border-bottom:0;width:100%}
.list .it:first-child{border-top:0}
.list .it:hover{background:var(--surface-2)}
.ue{font:600 15px var(--f-mono);min-width:3.2ch;color:var(--tc,var(--ink))}

/* ---------- listado ---------- */
.toolbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.toolbar .sp{margin-left:auto;display:flex;gap:8px;flex-wrap:wrap}
.tbl{border:1px solid var(--line);border-radius:var(--r);background:var(--surface);overflow:hidden}
.tr{display:grid;grid-template-columns:34px 76px 118px 110px minmax(160px,2fr) minmax(110px,1fr) 100px 96px 96px;gap:10px;align-items:center;padding:9px 14px;border-top:1px solid var(--line);cursor:pointer}
.tr.th{cursor:default;background:var(--surface-2);border-top:0;font:600 12.5px var(--f-display);letter-spacing:.09em;text-transform:uppercase;color:var(--ink-3);padding-block:8px}
.tr.th button{all:unset;cursor:pointer}
.tr.th button:hover{color:var(--ink)}
.tr:not(.th):hover{background:var(--surface-2)}
.tr.sel{background:var(--accent-soft)}
.tr .cut{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.tr .m{display:flex;align-items:center;gap:7px;min-width:0}
.chips{display:flex;flex-wrap:wrap;gap:6px;align-items:center;padding:5px 7px;border:1px solid var(--line-2);border-radius:var(--r);background:var(--surface);min-height:38px}
.chips:focus-within{outline:2px solid color-mix(in srgb,var(--accent) 70%,transparent);border-color:var(--accent)}
.chips .c{display:inline-flex;align-items:center;gap:2px;padding:1px 3px 1px 8px;border-radius:99px;background:var(--surface-3);font:500 13.5px var(--f-mono);border:1px solid var(--line)}
.chips .c.miss{border-style:dashed;color:var(--warn)}
.chips .c.ok{cursor:pointer}
.chips .c.ok:hover{border-color:var(--accent)}
.chips .c button{border:0;background:none;cursor:pointer;color:var(--ink-3);padding:1px;display:flex;border-radius:50%}
.chips .c button:hover{color:var(--err)}
.chips input{border:0!important;outline:0!important;min-height:26px!important;padding:2px 4px!important;flex:1 1 64px;min-width:64px;width:auto;background:none!important;font-family:var(--f-mono)}

/* ---------- editor ---------- */
.edhead{position:sticky;top:calc(env(safe-area-inset-top,0px) + 56px);z-index:20;background:var(--surface);border:1px solid var(--line);border-top:3px solid var(--tc);border-radius:var(--r);padding:10px 14px;display:flex;gap:12px;align-items:center;flex-wrap:wrap;box-shadow:var(--shadow)}
.edhead .big{font:600 30px/1 var(--f-display);letter-spacing:.02em}
.edhead .big small{font:500 15px var(--f-body);letter-spacing:0;color:var(--ink-2);margin-left:6px}
.edhead .sp{margin-left:auto;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.secnav{display:flex;gap:6px;flex-wrap:wrap}
.secnav a{padding:4px 10px;border-radius:99px;border:1px solid var(--line);background:var(--surface);text-decoration:none;color:var(--ink-2);font-size:13px;font-weight:500}
.secnav a:hover{border-color:var(--accent);color:var(--accent)}
.sec{scroll-margin-top:150px}
.sec>header h3{display:flex;align-items:center;gap:8px}
.sec .note{font-size:12.5px;color:var(--ink-3)}
.sub{display:block}
.subt{font:600 13px var(--f-display);letter-spacing:.09em;text-transform:uppercase;color:var(--ink-2);margin:2px 0 8px;display:flex;gap:10px;align-items:center}
.hr{height:1px;background:var(--line);margin:16px 0;border:0}
.rels{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px 16px}
.pct{position:relative}
.pct input{padding-right:26px}
.pct::after{content:"%";position:absolute;right:10px;bottom:9px;color:var(--ink-3);font-size:13px;pointer-events:none}
.scl{display:flex;flex-direction:column;gap:5px;min-width:0}
.scl .nm{font-size:13px;color:var(--ink-2)}
.scl .seg button{padding:4px 0;min-height:30px;flex:1;font-family:var(--f-mono)}
.complist{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
.mats{columns:4 230px;column-gap:20px}
.mgrp{break-inside:avoid;margin-bottom:14px}
.mgrp h4{font:600 14px var(--f-display);letter-spacing:.09em;text-transform:uppercase;margin-bottom:5px;color:var(--c-estrato);border-bottom:1px solid var(--line);padding-bottom:3px}
.mi{display:flex;gap:8px;align-items:center;padding:3px 4px;border-radius:4px;cursor:pointer;font-size:14px;line-height:1.25}
.mi:hover{background:var(--surface-2)}
.mi .nn{font:500 11.5px var(--f-mono);color:var(--ink-3);width:2.4ch;text-align:right;flex:none}
.mi:has(input:checked){background:var(--accent-soft)}
.mi:has(input:checked) .nn{color:var(--accent)}
.photos{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:12px}
.ph{display:flex;flex-direction:column;gap:6px;border:1px solid var(--line);border-radius:var(--r);padding:6px;background:var(--surface-2)}
.ph .im{aspect-ratio:4/3;background:var(--surface-3) center/contain no-repeat;border-radius:4px;cursor:zoom-in;position:relative;border:0;padding:0;width:100%}
.ph .im img{width:100%;height:100%;object-fit:contain;border-radius:4px;display:block}
.ph input{min-height:30px;font-size:13.5px;padding:3px 8px}
.ph .acts{display:flex;gap:6px}

}

const RAW_BLOBS = new Map();

function dataUrlToBlob(dataURL) {
  try {
    const parts = dataURL.split(',');
    const mime = parts[0].match(/:(.*?);/)[1];
    const bstr = atob(parts[1]);
    let n = bstr.length;
    const u8arr = new Uint8Array(n);
    while (n--) u8arr[n] = bstr.charCodeAt(n);
    return new Blob([u8arr], { type: mime });
  } catch (e) {
    return new Blob([], { type: 'image/jpeg' });
  }
}

function blobToDataURL(blob) {
  return new Promise((res, rej) => {
    const reader = new FileReader();
    reader.onload = () => res(reader.result);
    reader.onerror = rej;
    reader.readAsDataURL(blob);
  });
}

function processImageFile(file, maxDim = 2048, q = 0.82) {
  return new Promise((resolve, reject) => {
    const url = URL.createObjectURL(file);
    const im = new Image();
    im.onload = () => {
      let w = im.naturalWidth, h = im.naturalHeight;
      const k = Math.min(1, maxDim / Math.max(w, h));
      w = Math.round(w * k);
      h = Math.round(h * k);
      const c = document.createElement('canvas');
      c.width = w;
      c.height = h;
      const ctx = c.getContext('2d');
      ctx.fillStyle = '#ffffff';
      ctx.fillRect(0, 0, w, h);
      ctx.drawImage(im, 0, 0, w, h);
      URL.revokeObjectURL(url);
      
      // Intentar WebP primero con fallback a JPEG
      c.toBlob(blob => {
        if (blob) {
          resolve(blob);
        } else {
          c.toBlob(b2 => resolve(b2 || file), 'image/jpeg', q);
        }
      }, 'image/webp', q);
    };
    im.onerror = () => {
      URL.revokeObjectURL(url);
      reject(new Error('Formato de imagen no válido'));
    };
    im.src = url;
  });
}

async function putImage(source) {
  let blob;
  if (source instanceof Blob) {
    blob = source;
  } else if (source instanceof HTMLCanvasElement) {
    blob = await new Promise(res => source.toBlob(res, 'image/webp', 0.85));
    if (!blob) blob = await new Promise(res => source.toBlob(res, 'image/png'));
  } else if (typeof source === 'string' && source.startsWith('data:')) {
    blob = dataUrlToBlob(source);
  } else {
    blob = new Blob([], { type: 'image/jpeg' });
  }

  const id = uid('im');
  const url = URL.createObjectURL(blob);
  IMG.set(id, url);
  RAW_BLOBS.set(id, blob);

  try {
    await idbPut('images', { id, projectId: S.pid, data: blob });
  } catch (e) {
    console.error('Error al guardar imagen en IndexedDB:', e);
    toast('No se pudo guardar la imagen en el almacenamiento local.', 'err');
  }
  return id;
}

const imgSrc = id => (id && IMG.get(id)) || '';

async function loadImages(pid) {
  // Liberar URLs de objetos previas para evitar fugas de memoria
  for (const [id, url] of IMG.entries()) {
    if (url && typeof url === 'string' && url.startsWith('blob:')) {
      try { URL.revokeObjectURL(url); } catch (e) {}
    }
  }
  IMG.clear();
  RAW_BLOBS.clear();

  const rows = await idbImgs(pid).catch(() => []);
  for (const r of rows) {
    if (r.data instanceof Blob) {
      const url = URL.createObjectURL(r.data);
      IMG.set(r.id, url);
      RAW_BLOBS.set(r.id, r.data);
    } else if (typeof r.data === 'string' && r.data.startsWith('data:')) {
      // Migración transparente en caliente desde Base64 V1 a Blob V2
      IMG.set(r.id, r.data);
      try {
        const blob = dataUrlToBlob(r.data);
        RAW_BLOBS.set(r.id, blob);
        idbPut('images', { id: r.id, projectId: r.projectId || pid, data: blob }).catch(() => {});
      } catch (err) {}
    }
  }
}

function ix(p) {
  if (p._ix) return p._ix;
  const byUE = new Map(), dup = new Map();
  p.records.forEach(r => {
    if (r.type !== 'muraria' && r.ue != null) {
      if (byUE.has(r.ue)) { if (!dup.has(r.ue)) dup.set(r.ue, [byUE.get(r.ue)]); dup.get(r.ue).push(r); } else byUE.set(r.ue, r);
    }
  });
  return (p._ix = { byUE, dup });
}
const byUE = (p, n) => ix(p).byUE.get(n);
function nextUE(p) { const used = new Set(p.records.filter(r => r.type !== 'muraria' && r.ue != null).map(r => r.ue)); let n = 1; const mx = Math.max(0, ...used); n = mx + 1; return n; }

/* relaciones con reciprocidad automática */
function addRel(p, rec, k, n) {
  if (rec.ue == null || n === rec.ue || !(n > 0)) return false;
  let ch = false;
  if (!rec.rel[k].includes(n)) { rec.rel[k].push(n); rec.rel[k].sort(numAsc); ch = true; }
  const o = byUE(p, n);
  if (o && o.rel) { const ik = REL_BY[k].inv; if (!o.rel[ik].includes(rec.ue)) { o.rel[ik].push(rec.ue); o.rel[ik].sort(numAsc); o.updatedAt = Date.now(); ch = true; } }
  return ch;
}
function delRel(p, rec, k, n) {
  rec.rel[k] = rec.rel[k].filter(x => x !== n);
  const o = byUE(p, n);
  if (o && o.rel) { const ik = REL_BY[k].inv; o.rel[ik] = o.rel[ik].filter(x => x !== rec.ue); o.updatedAt = Date.now(); }
}
function adoptIncoming(p, rec) { // relaciones que otras fichas ya declaran hacia esta UE
  p.records.forEach(o => {
    if (o === rec || !o.rel) return;
    REL.forEach(r => { if (o.rel[r.k].includes(rec.ue) && !rec.rel[r.inv].includes(o.ue)) { rec.rel[r.inv].push(o.ue); rec.rel[r.inv].sort(numAsc); } });
  });
}
function renumber(p, rec, nuevo) {

/* =====================  CONTROL DE COHERENCIA  ===================== */
function analyze(p) {
  if (p._an) return p._an;
  const iss = []; const { byUE: idx, dup } = ix(p);
  const add = (sev, code, msg, rec, fix) => iss.push({ sev, code, msg, rid: rec && rec.id, ue: rec && rec.ue, fix });
  dup.forEach((arr, ue) => add('err', 'dup', `La UE ${ue} está repetida en ${arr.length} fichas (${arr.map(r => TIPOS[r.type].label).join(', ')}).`, arr[0], { act: 'renumdup', label: 'Revisar' }));
  const recs = p.records.filter(r => r.type !== 'muraria' && r.ue != null);
  const missingRefs = new Map();
  recs.forEach(r => {
    REL.forEach(rl => r.rel[rl.k].forEach(n => {
      if (n === r.ue) { add('err', 'self', `La UE ${r.ue} aparece relacionada consigo misma (${rl.l}).`, r); return; }
      const o = idx.get(n);
      if (!o) { if (!missingRefs.has(n)) missingRefs.set(n, new Set()); missingRefs.get(n).add(r.ue); return; }
      if (!o.rel[rl.inv].includes(r.ue)) add('warn', 'recip', `UE ${r.ue} «${rl.l.toLowerCase()}» UE ${n}, pero la UE ${n} no registra la relación inversa («${REL_BY[rl.inv].l.toLowerCase()}» ${r.ue}).`, r, { act: 'fixrecip', label: 'Completar', a: r.id, k: rl.k, n });
    }));
  });
  missingRefs.forEach((from, n) => add('info', 'noficha', `La UE ${n} se cita desde ${[...from].sort(numAsc).map(x => 'UE ' + x).join(', ')} y todavía no tiene ficha.`, null, { act: 'newue', label: 'Crear ficha', n }));
  // ciclos y contradicciones
  const m = harrisModel(p, { reduce: false, missing: false });
  const seen = new Set();
  m.cyc.forEach(c => { const k = [c.a, c.b].sort(numAsc).join('-'); if (seen.has(k)) return; seen.add(k); add('err', 'cycle', `Contradicción estratigráfica: la relación entre UE ${c.a} y UE ${c.b} cierra un ciclo (algo sería anterior y posterior a sí mismo).`, idx.get(c.a), { act: 'goue', label: 'Abrir UE ' + c.a, n: c.a }); });
  // grupo contemporáneo con relación de anterioridad interna
  m.eqList.forEach(([a, b]) => { const A = m.down.get(a), B = m.down.get(b); if ((A && A.has(b)) || (B && B.has(a))) add('err', 'eqord', `UE ${a} y UE ${b} figuran como iguales o equivalentes y a la vez en relación de anterioridad.`, idx.get(a)); });
  // sin relaciones
  recs.forEach(r => { if (!Object.values(r.rel).some(a => a.length) && p.records.length > 1) add('warn', 'iso', `La UE ${r.ue} no tiene ninguna relación estratigráfica registrada.`, r); });
  // coherencia cronológica heurística
  m.down.forEach((set, a) => set.forEach(b => {
    const A = idx.get(a), B = idx.get(b); if (!A || !B) return; const ra = periodRange(p, A.datacion), rb = periodRange(p, B.datacion);

/* =====================  HERRAMIENTAS DE CAMPO: GPS UTM, GEOJSON Y DICTADO  ===================== */
function wgs84ToUTM(lat, lon) {
  const a = 6378137.0;
  const f = 1 / 298.257223563;
  const b = a * (1 - f);
  const e = Math.sqrt(1 - (b * b) / (a * a));
  const e_prime_sq = (e * e) / (1 - e * e);
  const k0 = 0.9996;

  const zone = Math.floor((lon + 180) / 6) + 1;
  const lon_origin = (zone - 1) * 6 - 180 + 3;
  const lon_origin_rad = (lon_origin * Math.PI) / 180;
  const lat_rad = (lat * Math.PI) / 180;
  const lon_rad = (lon * Math.PI) / 180;

  const N = a / Math.sqrt(1 - e * e * Math.sin(lat_rad) * Math.sin(lat_rad));
  const T = Math.tan(lat_rad) * Math.tan(lat_rad);
  const C = e_prime_sq * Math.cos(lat_rad) * Math.cos(lat_rad);
  const A = Math.cos(lat_rad) * (lon_rad - lon_origin_rad);

  const M = a * ((1 - (e * e) / 4 - (3 * e ** 4) / 64 - (5 * e ** 6) / 256) * lat_rad
           - ((3 * e * e) / 8 + (3 * e ** 4) / 32 + (45 * e ** 6) / 1024) * Math.sin(2 * lat_rad)
           + ((15 * e ** 4) / 256 + (45 * e ** 6) / 1024) * Math.sin(4 * lat_rad)
           - ((35 * e ** 6) / 3072) * Math.sin(6 * lat_rad));

  let x = k0 * N * (A + ((1 - T + C) * A ** 3) / 6 + ((5 - 18 * T + T * T + 72 * C - 58 * e_prime_sq) * A ** 5) / 120) + 500000.0;
  let y = k0 * (M + N * Math.tan(lat_rad) * ((A * A) / 2 + ((5 - T + 9 * C + 4 * C * C) * A ** 4) / 24 + ((61 - 58 * T + T * T + 600 * C - 330 * e_prime_sq) * A ** 6) / 720));
  if (lat < 0) y += 10000000.0;

  return {
    zone,
    x: Math.round(x * 100) / 100,
    y: Math.round(y * 100) / 100,
    epsg: 25800 + zone
  };
}

function captureGPSForRecord(r) {
  if (!navigator.geolocation) {
    toast('Este navegador o dispositivo no soporta geolocalización.', 'err');
    return;
  }
  toast('Buscando señal GPS de precisión…');
  navigator.geolocation.getCurrentPosition(
    pos => {
      const lat = pos.coords.latitude;
      const lon = pos.coords.longitude;
      const utm = wgs84ToUTM(lat, lon);
      const alt = pos.coords.altitude ? Math.round(pos.coords.altitude * 100) / 100 : null;
      const acc = Math.round(pos.coords.accuracy * 10) / 10;

      r.geo = {
        lat: Math.round(lat * 1e6) / 1e6,
        lon: Math.round(lon * 1e6) / 1e6,
        utmX: utm.x,
        utmY: utm.y,
        zone: utm.zone,
        epsg: utm.epsg,
        alt,
        acc,
        timestamp: Date.now()
      };
      touch(r);
      refreshEditor();
      toast(`GPS capturado: Huso ${utm.zone}N · X: ${utm.x} Y: ${utm.y} (±${acc}m)`);
    },
    err => {
      console.warn('Error GPS:', err);
      toast('No se pudo obtener la posición GPS (' + (err.message || 'sin señal') + ').', 'err');
    },
    { enableHighAccuracy: true, timeout: 15000, maximumAge: 10000 }
  );
}

function generateProjectGeoJSON(p) {
  const features = [];
  p.records.forEach(r => {
    if (r.geo && r.geo.lon && r.geo.lat) {
      features.push({
        type: 'Feature',
        geometry: {
          type: 'Point',
          coordinates: [r.geo.lon, r.geo.lat, r.geo.alt || 0]
        },
        properties: {
          id: r.id,
          ue: r.ue || r.num || null,
          tipo: r.type,
          claseUE: r.claseUE || 'positiva',
          hecho: r.hecho || '',
          fase: r.fase || '',
          datacion: r.datacion || r.cronPrincipal || '',
          conservacion: r.conservacion || '',
          utm_x: r.geo.utmX,
          utm_y: r.geo.utmY,
          utm_huso: r.geo.zone,
          precision_m: r.geo.acc,
          descripcion: (r.descripcion || '').slice(0, 250),
          interpretacion: (r.interpretacion || '').slice(0, 180)

    type: 'FeatureCollection',

// Dictado por voz continuo
let activeSpeech = null;
function toggleDictation(btn, inputEl) {
  const SpeechRec = window.SpeechRecognition || window.webkitSpeechRecognition;
  if (!SpeechRec) {
    toast('El dictado por voz no está disponible en este navegador.', 'err');
    return;
  }

  if (activeSpeech) {
    activeSpeech.stop();
    activeSpeech = null;
    btn.classList.remove('rec');
    toast('Dictado por voz finalizado.');
    return;
  }

  const rec = new SpeechRec();
  rec.lang = 'es-ES';
  rec.continuous = true;
  rec.interimResults = false;

  rec.onstart = () => {
    activeSpeech = rec;
    btn.classList.add('rec');
    toast('Escuchando… hable con claridad.');
  };

  rec.onresult = ev => {
    let transcript = '';
    for (let i = ev.resultIndex; i < ev.results.length; i++) {
      transcript += ev.results[i][0].transcript;
    }
    if (transcript) {
      const cur = inputEl.value;
      const space = cur && !cur.endsWith(' ') && !cur.endsWith('\n') ? ' ' : '';
      inputEl.value = cur + space + transcript;
      inputEl.dispatchEvent(new Event('input', { bubbles: true }));
    }
  };

  rec.onerror = e => {
    btn.classList.remove('rec');
    activeSpeech = null;
    toast('Error en el micrófono o dictado.', 'err');
  };

  rec.onend = () => {
    btn.classList.remove('rec');
    activeSpeech = null;
  };

  try {
    rec.start();
  } catch (err) {
    toast('No se pudo activar el micrófono.', 'err');
  }
}

      const width = colWidths[cIdx] ? `<w:tcW w:w="${colWidths[cIdx]}" w:type="dxa"/>` : '';

      xml += `<w:tc><w:tcPr>${width}<w:shd w:val="clear" w:color="auto" w:fill="${bg}"/><w:tcMar><w:top w:w="120" w:type="dxa"/><w:bottom w:w="120" w:type="dxa"/><w:left w:w="140" w:type="dxa"/><w:right w:w="140" w:type="dxa"/></w:tcMar></w:tcPr>`;
      xml += `<w:p><w:pPr><w:spacing w:before="0" w:after="0"/></w:pPr><w:r><w:rPr>${isBold ? '<w:b/>' : ''}<w:color w:val="${textColor}"/><w:sz w:val="19"/><w:rFonts w:ascii="Calibri" w:hAnsi="Calibri"/></w:rPr><w:t xml:space="preserve">${docxXmlEsc(cell)}</w:t></w:r></w:p>`;
      xml += '</w:tc>';
    });
    xml += '</w:tr>';
  });

  xml += '</w:tbl>';
  return xml;
}

  const samplesTable = [

  body += docxH1Xml('6. Libro de Registro Tabular Correlativo (Concordancias)');
  body += docxPXml('Índice maestro de concordancias de todas las Unidades Estratigráficas de la excavación:');

  const libroTable = [
    ['UE', 'Clase / Tipo', 'Sector', 'Definición / Interpretación', 'Fase', 'Cotas (Sup/Inf)', 'Relaciones Inmediatas']
  ];
  if (recs.length) {
    recs.forEach(r => {
      const isNeg = r.type === 'estrato' && r.claseUE === 'negativa';
      const c1 = (r.cotas && r.cotas[0]) || {};

        r.ue != null ? `UE ${String(r.ue).padStart(3, '0')}` : (r.num != null ? `CATA ${r.num}` : 'UE'),

  body += '<w:sectPr><w:pgSz w:w="11906" w:h="16838"/><w:pgMar w:top="1440" w:right="1440" w:bottom="1440" w:left="1440"/></w:sectPr>';

  zip.file('word/document.xml', `<?xml version="1.0" encoding="UTF-8" standalone="yes"?>
<w:document xmlns:w="http://schemas.openxmlformats.org/wordprocessingml/2006/main">
  <w:body>${body}</w:body>
</w:document>`);

  const blob = await zip.generateAsync({
    type: 'blob',
    mimeType: 'application/vnd.openxmlformats-officedocument.wordprocessingml.document'

  return blob;

/* =====================  MÓDULO DE MUESTRAS CIENTÍFICAS  ===================== */
function newSample(p, ue, tipo) {
  const count = ((p.samples || []).length) + 1;
  const acr = p.meta.acronimo || 'YAC';
  const ueStr = ue ? `UE${ue}` : '';
  return {
    id: uid('smp'),
    numMuestra: `M-${count}${ueStr ? ' (' + ueStr + ')' : ''}`,
    ue: ue ? Number(ue) : null,
    tipoAnalisis: tipo || 'C14 (Radiocarbono)',
    objetivo: '',
    cotaXYZ: '',
    volumenPeso: '',
    recipiente: 'Bolsa estéril',
    fecha: today(),
    recogidoPor: p.meta.autorDefecto || '',
    laboratorio: '',
    codigoLab: '',
    estado: 'campo',
    resultado: '',
    observaciones: '',
    createdAt: Date.now(),
    updatedAt: Date.now()
  };
}

function filteredSamples() {
  const p = P(); if (!p) return [];
  const list = p.samples || [];
  const f = S.samplesF;
  const q = norm(f.q.trim());
  return list.filter(item => {
    if (f.tipo && item.tipoAnalisis !== f.tipo) return false;
    if (f.estado && item.estado !== f.estado) return false;
    if (f.ue && String(item.ue) !== String(f.ue)) return false;
    if (q) {
      const txt = norm([item.numMuestra, item.tipoAnalisis, item.laboratorio, item.codigoLab, item.resultado, item.recogidoPor, item.ue ? 'ue' + item.ue : ''].join(' '));
      if (!txt.includes(q)) return false;
    }
    return true;
  }).sort((a, b) => b.createdAt - a.createdAt);
}

function newFind(p, ue, tipo) {
  const count = ((p.finds || []).length) + 1;
  const acr = p.meta.acronimo || 'YAC';
  const ueStr = ue ? `UE${ue}` : 'SUP';
  return {
    id: uid('f'),
    sigla: `${acr}/${ueStr}/${count}`,
    ue: ue ? Number(ue) : null,
    hecho: '',
    tipoMaterial: tipo || 'Cerámica',
    clase: '',
    descripcion: '',
    pesoGramos: '',
    numFragmentos: 1,
    cajaBolsa: '',
    estado: 'campo',
    fotos: [],
    fecha: today(),
    autor: p.meta.autorDefecto || '',
    createdAt: Date.now(),
    updatedAt: Date.now()
  };
}

function filteredFinds() {
  const p = P(); if (!p) return [];
  const list = p.finds || [];
  const f = S.findsF;
  const q = norm(f.q.trim());
  return list.filter(item => {
    if (f.tipo && item.tipoMaterial !== f.tipo) return false;
    if (f.estado && item.estado !== f.estado) return false;
    if (f.ue && String(item.ue) !== String(f.ue)) return false;
    if (q) {
      const txt = norm([item.sigla, item.tipoMaterial, item.clase, item.descripcion, item.cajaBolsa, item.autor, item.ue ? 'ue' + item.ue : ''].join(' '));
      if (!txt.includes(q)) return false;
    }
    return true;
  }).sort((a, b) => b.createdAt - a.createdAt);
}

          find.tipoMaterial = $('#m_find_mat').value;
          find.clase = $('#m_find_clase').value.trim();
          find.numFragmentos = Number($('#m_find_num').value) || 1;
          find.pesoGramos = $('#m_find_peso').value ? Number($('#m_find_peso').value) : '';

          }

      }

}

function searchText(r) { return norm([recKey(r), 'ue' + r.ue, r.hecho, r.descripcion, r.interpretacion, r.datacion, r.autor, r.localizacion, r.ubicacion, r.cronPrincipal, r.tipoEstr, r.aparejo, r.acronimo, r.esq && r.esq.indiv, r.esq && esqSearch(r)].join(' ')); }
function filteredRecs() {
  const p = P(); const q = norm(S.q.trim()); const f = S.f;
  let a = p.records.filter(r => {
    let matchTipo = true;
    if (f.tipo === 'corte') matchTipo = (r.type === 'estrato' && r.claseUE === 'negativa');
    else if (f.tipo === 'estrato') matchTipo = (r.type === 'estrato' && r.claseUE !== 'negativa');
    else if (f.tipo) matchTipo = (r.type === f.tipo);
    return matchTipo && (!f.estado || r.status === f.estado) && (!f.hecho || r.hecho === f.hecho) && (!q || searchText(r).includes(q));
  });
  const key = { ue: r => recSort(r), tipo: r => r.type, hecho: r => norm(r.hecho), datacion: r => norm(r.datacion || r.cronPrincipal), estado: r => r.status, mod: r => r.updatedAt, comp: r => completeness(r).pct }[f.sort] || (r => recSort(r));
  a.sort((x, y) => { const A = key(x), B = key(y); return (A < B ? -1 : A > B ? 1 : recSort(x) - recSort(y)) * f.dir; });
  return a;
}

  <div class="tbl" role="table" aria-label="Fichas del proyecto">
    <div class="tr th" role="row"><span><input type="checkbox" id="selall" aria-label="Seleccionar todas" ${a.length && a.every(r => S.sel.has(r.id)) ? 'checked' : ''}></span>${th('ue', 'UE')}${th('tipo', 'Tipo')}${th('hecho', 'Hecho', 'hide-m')}${th('', 'Descripción')}${th('datacion', 'Datación', 'hide-m')}${th('estado', 'Estado')}${th('comp', 'Completa', 'hide-m')}${th('mod', 'Modificada', 'hide-m')}</div>
    ${a.length ? a.map(r => { const c = completeness(r); return `<div class="tr ${S.sel.has(r.id) ? 'sel' : ''}" data-act="open" data-id="${r.id}" role="row"><span><input type="checkbox" data-act="selrow" data-id="${r.id}" ${S.sel.has(r.id) ? 'checked' : ''} aria-label="Seleccionar ${esc(recKey(r))}"></span><span class="ue t-${r.type}">${esc(recKey(r))}</span><span class="m hide-s"><span class="tag ${r.type === 'estrato' && r.claseUE === 'negativa' ? 't-corte' : 't-' + r.type}">${r.type === 'muraria' ? 'Cata' : (r.type === 'estrato' && r.claseUE === 'negativa' ? 'Corte (−)' : (r.type === 'estrato' ? 'Estrato (+)' : TIPOS[r.type].label))}</span></span><span class="cut hide-m hide-s">${esc(r.hecho)}</span><span class="cut">${esc((r.descripcion || r.interpretacion || r.ubicacion || '').replace(/\s+/g, ' ').slice(0, 120)) || '<span class="faint">Sin descripción</span>'}</span><span class="cut hide-m hide-s">${esc(r.datacion || r.cronPrincipal || '')}</span><span><span class="tag st st-${r.status}">${ESTADOS[r.status]}</span></span><span class="hide-m hide-s"><span class="meter ${c.pct < 40 ? 'lo' : c.pct < 80 ? 'mid' : 'hi'}" title="${c.pct}%"><i style="width:${c.pct}%"></i></span></span><span class="faint hide-m hide-s" style="font-size:12.5px">${fmtDT(r.updatedAt).slice(0, 8)}</span></div>`; }).join('') : `<div class="empty"><b>${p.records.length ? 'Ninguna ficha coincide' : 'Aún no hay fichas'}</b>${p.records.length ? 'Pruebe con otro filtro o búsqueda.' : 'Pulse «Nueva ficha» para registrar la primera unidad estratigráfica.'}</div>`}

  return `<div class="banner ${an.err ? '' : 'info'}">${ic(an.err ? 'alert' : 'check')}<span>${an.iss.length ? `<b>${an.err} errores, ${an.warn} avisos y ${an.info} observaciones.</b> Los errores indican contradicciones que impiden construir una matriz válida.` : '<b>Sin incidencias.</b> Las relaciones son coherentes y no se han detectado ciclos.'}</span>${fixable ? `<span class="sp"><button class="btn p s" data-act="fixallrecip">Completar ${fixable} relaciones inversas</button></span>` : ''}</div>
  ${group('err', 'Errores')}${group('warn', 'Avisos')}${group('info', 'Observaciones')}

}

async function showQuota() {
  const el = $('#quota'); if (!el) return;
  try {
    const e = await navigator.storage.estimate();
    const pers = (navigator.storage && navigator.storage.persisted) ? await navigator.storage.persisted() : false;
    const mode = window.matchMedia('(display-mode: standalone)').matches ? 'PWA instalada' : (location.protocol === 'file:' ? 'Archivo local' : 'Navegador');
    el.innerHTML = `<b>${(e.usage / 1048576).toFixed(1)} MB</b> usados de ${(e.quota / 1048576 / 1024).toFixed(1)} GB · Almacenamiento binario Blob · ${pers ? 'Almacenamiento persistente activado' : 'Almacenamiento estándar'} · Modo: ${mode}`;
  } catch (er) { el.textContent = ''; }
}

function cotasSummary(r) {

function dimStats(d) {
  const col = k => d.map(x => parseNum(x[k])).filter(v => v != null); const m = a => a.length ? a.reduce((s, v) => s + v, 0) / a.length : null;
  const L = col('l'), A = col('a'), G = col('g'); return { n: Math.max(L.length, A.length, G.length), l: m(L), a: m(A), g: m(G) };
}

  if (!m.nodes.length) return `<div class="empty panel"><b>La matriz aparecerá aquí</b>Cree fichas de estrato o estructura y anote sus relaciones estratigráficas («cubre a», «corta a», «se apoya en»…). La matriz se dibuja y se reordena sola.<br><br><button class="btn p" data-act="newrec">${ic('plus')}Nueva ficha</button></div>`;

function fullDoc(inner, title, { landscape, auto } = {}) {
  return `<!doctype html><html lang="es"><head><meta charset="utf-8"><title>${esc(title)}</title><style>${PCSS}${PCSS_ESQ}${landscape ? '@page{size:A4 landscape;margin:9mm}' : ''}</style></head><body>${auto ? `<div class="no-print-note"><span>Para guardar como PDF: pulse «Imprimir» y elija «Guardar como PDF» como destino.</span><button onclick="window.print()">Imprimir</button></div>` : ''}${inner}${auto ? '<script>window.addEventListener("load",function(){setTimeout(function(){try{window.print()}catch(e){}},500)})<\/script>' : ''}</body></html>`;
}
async function outputPrint(inner, title, opt = {}) {
  if (IN_ARTIFACT) {
    const ok = await saveFile(slug(title) + '.html', fullDoc(inner, title, { ...opt, auto: true }), 'text/html');
    if (ok) toast('Abra el archivo descargado e imprima: se abre el diálogo para guardar como PDF.');
    return;
  }
  const old = $('#printframe'); if (old) old.remove();
  const fr = document.createElement('iframe'); fr.id = 'printframe'; fr.setAttribute('aria-hidden', 'true');
  fr.style.cssText = 'position:fixed;right:0;bottom:0;width:0;height:0;border:0;visibility:hidden';
  fr.srcdoc = fullDoc(inner, title, opt); document.body.appendChild(fr);
  fr.onload = () => { setTimeout(() => { try { fr.contentWindow.focus(); fr.contentWindow.print(); } catch (e) { toast('No se pudo abrir el diálogo de impresión.', 'err'); } }, 350); };
}
function printRecords(recs, opt = {}) {
  const p = P(); if (!recs.length) { toast('No hay fichas que imprimir.'); return; }
  recs = [...recs].sort((a, b) => recSort(a) - recSort(b));
  const inner = recs.map(r => sheetsFor(r, p, opt)).join('');
  const title = recs.length === 1 ? `${p.meta.acronimo || 'ficha'}-${recKey(recs[0]).replace(' ', '')}` : `fichas-${slug(p.name)}`;
  outputPrint(inner, title);
}

function conflictOf(r, k, n) {
  const post = POSTERIOR.has(k), ant = ANTERIOR.has(k);
  if (post && [...ANTERIOR].some(x => r.rel[x].includes(n))) return 'ya figura como posterior a esta UE';
  if (ant && [...POSTERIOR].some(x => r.rel[x].includes(n))) return 'ya figura como anterior a esta UE';
  if ((post || ant) && (r.rel.igual.includes(n) || r.rel.equivale.includes(n))) return 'ya figura como igual o equivalente';
  if (!post && !ant && [...POSTERIOR, ...ANTERIOR].some(x => r.rel[x].includes(n))) return 'ya tiene una relación de anterioridad con esta UE';
  const same = (post ? POSTERIOR : ANTERIOR); if ((post || ant) && [...same].some(x => x !== k && r.rel[x].includes(n))) return null; return null;
}

  const r = CUR(), p = P(); const path = ch.dataset.chips; let changed = false;
  if (path === 'ues') { nums.forEach(n => { if (!r.ues.includes(n)) { r.ues.push(n); changed = true; } }); r.ues.sort(numAsc); }
  else if (/^esq\./.test(path)) { const a = getPath(r, path); nums.forEach(n => { if (!a.includes(n)) { a.push(n); changed = true; } }); a.sort(numAsc); }

      const cf = conflictOf(r, k, n); if (cf) { toast(`UE ${n} ${cf}. Revise las relaciones antes de añadirla.`, 'err'); return; }
      if (addRel(p, r, k, n)) changed = true;

}
async function addPhotos(path, files, replaceIdx) {

  if (!el) return;

}

(async function boot() {
  applyTheme();
  
  // 1. Red y Service Worker
  window.addEventListener('online', () => { updateNetStatus(); toast('Conexión de red restablecida.', 'ok'); });
  window.addEventListener('offline', () => { updateNetStatus(); toast('Trabajando sin conexión (modo campo activo).', 'warn'); });
  
  window.addEventListener('beforeinstallprompt', e => {
    e.preventDefault();
    deferredInstallPrompt = e;

    if (btn) btn.style.display = 'inline-flex';
  });

  if ('serviceWorker' in navigator && (location.protocol === 'http:' || location.protocol === 'https:')) {

      console.log('[PWA] Service Worker registrado en el ámbito:', reg.scope);
    }).catch(err => {
      console.warn('[PWA] No se pudo registrar Service Worker:', err);
    });
  }

  // Solicitar almacenamiento persistente para evitar borrados automáticos del navegador

    navigator.storage.persist().catch(() => {});

})();
